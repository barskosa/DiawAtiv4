# Aplicação completa com um comando (não precisa de Java nem de Node instalados):
#   docker compose up -d --build        → abra http://localhost:3000
# Só o banco, para desenvolver com ./mvnw e npm run dev:
#   docker compose up -d mongodb
# Parar: docker compose down   |   Parar e apagar os dados: docker compose down -v
#
# Para usar o MongoDB Atlas, crie um arquivo .env na raiz (veja .env.example) com MONGODB_URI.
services:
  mongodb:
    image: mongo:8.0
    container_name: pokedex-mongodb
    ports:
      - "27017:27017"
    volumes:
      - pokedex-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pokedex-backend
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-pokedex}
      POKEDEX_SEED_MODE: ${POKEDEX_SEED_MODE:-if-empty}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: pokedex-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pokedex-mongo-data:
