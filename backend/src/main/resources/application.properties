spring.application.name=pokedex-api

# Credenciais locais opcionais em backend/.env (ignorado pelo Git). Veja .env.example.
# Variáveis de ambiente do sistema têm prioridade sobre o arquivo.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

server.port=${PORT:8080}

# MongoDB Atlas: MONGODB_URI=mongodb+srv://<usuario>:<senha>@<cluster>.mongodb.net/
# MongoDB local (docker compose): mongodb://localhost:27017
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:pokedex}

# if-empty: popula cada coleção vazia a partir do Script_Pokedex.sql (padrão)
# always: apaga as coleções e importa o script novamente a cada inicialização
# never: não importa dados
pokedex.seed.mode=${POKEDEX_SEED_MODE:if-empty}
pokedex.seed.script=${POKEDEX_SEED_SCRIPT:classpath:db/Script_Pokedex.sql}

pokedex.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}

# Documentação interativa da API
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
